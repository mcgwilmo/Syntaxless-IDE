# Data types
#
# Lesson 2 of the operators track.
# See ../README.md for what each field means and how to add a lesson.

id: data-types
number: 2
title: Data types
overview: A data type tells you what kind of value something is. The type matters because different kinds of values support different operations.
topics:
  - id: common-data-types
    title: Common data types
    definition: Common data types include numbers, strings, booleans, lists, tuples, sets, and dictionaries.
    howAndWhy: Knowing the type of a value prevents mistakes. For example, text and numbers are handled differently, and a list behaves differently from a single value.
    examples:
      - id: common-data-types-example
        strict:
          - Create a variable called name.
          - Set name to the text "Ava".
          - Create a variable called age.
          - Set age to the number 19.
          - Create a variable called is_enrolled.
          - Set is_enrolled to true.
        standard:
          - Set name to "Ava".
          - Set age to 19.
          - Set is_enrolled to true.
        abstraction:
          - Record a student named "Ava", aged 19, who is enrolled.
        pseudocode:
          - SET name TO "Ava"
          - SET age TO 19
          - SET is_enrolled TO TRUE
  - id: why-type-matters
    title: Why type matters
    definition: Type matters because the program needs to know what actions make sense for a value.
    howAndWhy: You can add numbers, slice strings, loop through lists, and look up values in dictionaries. Each data type gives you its own useful operations.
    examples:
      - id: why-type-matters-example
        strict:
          - Create a variable called a.
          - Set a to 4.
          - Create a variable called b.
          - Set b to 7.
          - Check whether a is less than b.
          - Store that answer in a variable called is_smaller.
          - Join the text "Ada" and the text " Lovelace".
          - Store the joined text in a variable called full_name.
        standard:
          - Set a to 4 and b to 7.
          - Work out whether a is less than b and store it as is_smaller.
          - Join "Ada" and " Lovelace" and store the result as full_name.
        abstraction:
          - Work out whether 4 is less than 7, and join "Ada" and " Lovelace" into a full name.
        pseudocode:
          - SET a TO 4
          - SET b TO 7
          - SET is_smaller TO a < b
          - SET full_name TO "Ada" + " Lovelace"
